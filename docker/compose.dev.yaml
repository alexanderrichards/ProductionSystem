name: productionsystem

services:

    apache:
        build:
            context: .

    webapp:
        build:
            context: .
            target: productionsystem_dev
        volumes:
            - ../:/root/ProductionSystem:cached
        command: ["/root/install-local.sh", "webapp-daemon.py", "start", "-vvv", "--debug-mode"]

    monitoring-daemon:
        build:
            context: .
            target: productionsystem_dev
        volumes:
            - ../:/root/ProductionSystem:cached
        command: ["/root/install-local.sh", "monitoring-daemon.py", "start", "--debug-mode"]

    dirac-daemon:
        build:
            context: .
            target: dirac_daemon_dev
        environment:
            - PYTHON_ENV_ACTIVATE=/root/dirac_ui/diracos/diracosrc
        volumes:
            - ../:/root/ProductionSystem:cached
        command: ["/root/install-local.sh", "/root/entrypoint.sh", "dirac-daemon.py", "start", "--debug-mode"]
