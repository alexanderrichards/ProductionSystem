name: productionsystem

services:

    apache:
        # image: alexanderrichards/apache-proxy:latest
        build:
            context: .
            dockerfile: Dockerfile.apache
        container_name: productionsystem-apache
        restart: unless-stopped
        depends_on:
            dirac-daemon:
                condition: service_healthy
        ports:
            # - 80:80  # only want cert authorised
            - 443:443
        networks:
            - ps_net
        volumes:
            - grid-security:/etc/grid-security:ro
    # db:
    #     image: postgres:latest
    #     restart: unless-stopped
    #     container_name: productionsystem-db
    #     healthcheck:
    #         test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
    #         interval: 5s
    #         timeout: 5s
    #         retries: 10
    #         start_period: 10s
    #     env_file: .env
    #     networks:
    #         - ps_net
    #     ports:
    #         - 5432:5432
    #     environment:
    #         POSTGRES_USER: ${POSTGRES_USER}
    #         POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    #         POSTGRES_DB: ${POSTGRES_DB}
    #     volumes:
    #         - db-data:/var/lib/postgresql

    mariadb:
        image: mariadb:latest
        restart: unless-stopped
        container_name: productionsystem-mariadb
        healthcheck:
            test: ["CMD-SHELL", "echo 'SELECT 1' | mariadb -h mariadb -u${MARIADB_USER} -p${MARIADB_PASSWORD}"]
            interval: 30s
            timeout: 5s
            retries: 10
            start_period: 10s
        env_file: .env
        networks:
            - ps_net
        ports:
            - 3306:3306
        environment:
            MARIADB_USER: ${MARIADB_USER}
            MARIADB_PASSWORD: ${MARIADB_PASSWORD}
            MARIADB_DATABASE: ${MARIADB_DATABASE}
            MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
        volumes:
            - mariadb-data:/var/lib/mysql

    webapp:
        # image: alexanderrichards/productionsystem:latest
        build:
            context: .
            dockerfile: Dockerfile.productionsystem.lite
            args:
                PY_VERSION: ${PY_VERSION}
                GIT_BRANCH: ${GIT_BRANCH}
        container_name: productionsystem-webapp
        env_file: .env
        depends_on:
            apache:
                condition: service_started
            mariadb:
                condition: service_healthy
        # ports:
        #     - 8080:8080
        networks:
            - ps_net
        command: /bin/sh -c "source venv/bin/activate && webapp-daemon.py start -vvv --debug-mode"

    monitoring-daemon:
        # image: alexanderrichards/productionsystem:latest
        build:
            context: .
            dockerfile: Dockerfile.productionsystem.lite
            args:
                PY_VERSION: ${PY_VERSION}
                GIT_BRANCH: ${GIT_BRANCH}
        container_name: productionsystem-monitoring-daemon
        volumes:
            - ${GLOBUS_CERT}:/root/.globus/usercert.pem:ro  # needed as monitoring daemon checks that Imperial DIRAC is running. Maybe the dirac daemon should be doing this. 
            - ${GLOBUS_KEY}:/root/.globus/userkey.pem:ro
            - grid-security:/etc/grid-security:ro
        depends_on:
            dirac-daemon:
                condition: service_healthy
            mariadb:
                condition: service_healthy
        networks:
            - ps_net
        command: /bin/sh -c "source venv/bin/activate && monitoring-daemon.py start --debug-mode"

    dirac-daemon:
        # image: alexanderrichards/productionsystem:latest
        build:
            context: .
            dockerfile: Dockerfile.productionsystem
        container_name: productionsystem-dirac-daemon
        healthcheck:
            test: ["CMD", "curl", "-f", "http://dirac-daemon:18861/health"]
            interval: 30s
            timeout: 5s
            retries: 10
            start_period: 10s
        volumes:
            - ${GLOBUS_CERT}:/root/.globus/usercert.pem:ro
            - ${GLOBUS_KEY}:/root/.globus/userkey.pem:ro
            - grid-security:/root/dirac_ui/diracos/etc/grid-security
        depends_on:
            mariadb:
                condition: service_healthy
        networks:
            - ps_net
        # entrypoint: ["./dirac-daemon-entrypoint.sh"]

networks:
    ps_net:
        name: productionsystem-net
#gcr.io/distroless/static-debian13 - use this to setup grid-security volume
volumes:
    grid-security:
        name: grid-security

    # db-data:
    #     name: productionsystem-db-data

    mariadb-data:
        name: productionsystem-mariadb-data